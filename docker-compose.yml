# RuView Sensing-Server für OpenMediaVault (Compose-Plugin)
# Simulierte Daten, bis ein ESP32-S3 sendet; dann CSI_SOURCE=esp32 setzen.
# Zwei Dienste: RuView selbst und die eigene Demo "Wer ist wo".
services:
  ruview:
    image: ruvnet/wifi-densepose:latest
    container_name: ruview
    restart: unless-stopped
    ports:
      - "${RUVIEW_PORT:-3080}:3000"   # Web-UI + REST-API + WebSocket (Port am Server)
      - "5005:5005/udp"   # CSI-Daten vom ESP32 (ab Schritt 2)
    environment:
      - RUST_LOG=info
      - CSI_SOURCE=${CSI_SOURCE:-simulated}
      - RUVIEW_API_TOKEN=${RUVIEW_API_TOKEN:?RUVIEW_API_TOKEN fehlt in der .env}
      - SENSING_ALLOWED_HOSTS=${SERVER_IP:?SERVER_IP fehlt in der .env}
      - RUVIEW_UDP_ALLOW=${LAN_SUBNET:-192.168.1.0/24}
      - MODELS_DIR=/app/data/models
    volumes:
      - ./data:/app/data   # Aufnahmen, Modelle, Kalibrierung
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  demo:
    # Baut die Demo direkt aus dem GitHub-Repo (Ordner web/).
    build: https://github.com/webwurm/ruview.git#main:web
    image: ruview-demo:latest
    container_name: ruview-demo
    restart: unless-stopped
    depends_on:
      - ruview
    ports:
      - "${DEMO_PORT:-3090}:80"   # Demo im Browser
    environment:
      - RUVIEW_URL=http://ruview:3000
      - RUVIEW_API_TOKEN=${RUVIEW_API_TOKEN}
